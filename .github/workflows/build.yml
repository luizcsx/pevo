name: PEVO Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Zig (Versão Estável)
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Compilar PEVO
        run: zig build -Doptimize=ReleaseSafe

      - name: Upload do Executável
        uses: actions/upload-artifact@v4
        with:
          name: pevo-windows-x64
          path: zig-out/bin/pevo.exe
